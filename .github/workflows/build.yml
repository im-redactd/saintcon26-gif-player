name: build

on:
  push:
    branches: ['**']   # version tags are built by release.yml
  pull_request:
  workflow_dispatch:
  workflow_call:       # used by release.yml
    inputs:
      version:
        description: Version string stamped into the firmware (the release tag)
        type: string
        required: true

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    env:
      PICO_SDK_VERSION: 2.3.1
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build build-essential \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          arm-none-eabi-gcc --version | head -1

      - name: Fetch Pico SDK ${{ env.PICO_SDK_VERSION }}
        run: |
          git clone --depth 1 --branch "$PICO_SDK_VERSION" https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1 lib/tinyusb
          echo "PICO_SDK_PATH=$RUNNER_TEMP/pico-sdk" >> "$GITHUB_ENV"

      - name: Pick the version string
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-dev-${GITHUB_SHA::7}}"
          echo "SC26_VERSION=$version" >> "$GITHUB_ENV"
          echo "version: $version"

      # picotool (UF2 conversion only) and pioasm are built from source by the SDK
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSC26_VERSION="$SC26_VERSION"
          cmake --build build

      - name: Package release files
        run: python3 tools/package_release.py --version "$SC26_VERSION" --uf2 build/sc26_gif.uf2 --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: sc26-gif-player-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  tools:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONIOENCODING: utf-8
