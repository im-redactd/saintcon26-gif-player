name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    env:
      PICO_SDK_VERSION: 2.3.1
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build build-essential pkg-config \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib libusb-1.0-0-dev
          arm-none-eabi-gcc --version | head -1

      - name: Fetch Pico SDK ${{ env.PICO_SDK_VERSION }}
        run: |
          git clone --depth 1 --branch "$PICO_SDK_VERSION" https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1 lib/tinyusb
          echo "PICO_SDK_PATH=$RUNNER_TEMP/pico-sdk" >> "$GITHUB_ENV"

      # picotool and pioasm are built from source by the SDK when they are not installed
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # The binary contains Pico SDK (BSD-3-Clause), TinyUSB (MIT) and AnimatedGIF (Apache-2.0) code:
      # ship it with the license notices.
      - name: Bundle firmware with license notices
        run: |
          mkdir -p dist/LICENSES
          cp build/sc26_gif.uf2 LICENSE THIRD_PARTY_NOTICES.md dist/
          cp LICENSES/* dist/LICENSES/
          cp lib/AnimatedGIF/LICENSE dist/LICENSES/AnimatedGIF-Apache-2.0.txt
          cp lib/fatfs/LICENSE.txt dist/LICENSES/FatFs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sc26_gif-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  tools:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONIOENCODING: utf-8
