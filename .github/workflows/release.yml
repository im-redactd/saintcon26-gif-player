#
# Push a version tag to publish a GitHub Release with prebuilt firmware:
#   git tag v1.0.0 && git push origin v1.0.0
# Tags with a hyphen (v1.1.0-rc1) are published as pre-releases.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the release and upload its files
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sc26-gif-player-${{ github.sha }}
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag $prerelease \
            --title "SC26 GIF player $TAG" --notes-file dist/release-notes.md \
            dist/*.uf2 dist/*-licenses.zip dist/SHA256SUMS
